<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知識の戦い — Chishiki no Tatakai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700;900&family=Cinzel+Decorative:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- WS Status -->
<div id="ws-status">
  <div class="dot"></div>
  <span id="ws-status-text">Menghubungkan…</span>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Decorative vertical text -->
<div class="deco-vtext left">知識</div>
<div class="deco-vtext right">戦い</div>

<!-- Mobile Leaderboard Overlay -->
<div class="mobile-lb-overlay" id="mobile-lb-overlay" onclick="closeMobileLb()">
  <div class="mobile-lb-sheet" style="display:flex; flex-direction:column; gap:1.5rem; max-height:85vh;" onclick="event.stopPropagation()">
    <div style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:1.5rem;">
      <div>
        <div class="sidebar-title">🏆 Papan Skor</div>
        <div class="lb-list" id="mobile-lb-list"></div>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; min-height:180px;">
        <div class="sidebar-title">💬 Obrolan</div>
        <div class="chat-messages-container" style="flex:1; overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:.75rem; margin-bottom:.5rem; display:flex; flex-direction:column; gap:.5rem;">
        </div>
        <form style="display:flex; gap:.5rem;" onsubmit="event.preventDefault(); sendChatMessage(this)">
          <input type="text" class="chat-input input" style="padding:.5rem; font-size:.85rem;" placeholder="Ketik pesan…" autocomplete="off" />
          <button type="submit" class="btn btn-red" style="padding:.5rem 1rem; font-size:.85rem;">Kirim</button>
        </form>
      </div>
    </div>
    <button class="btn btn-ghost btn-full mt-1" onclick="closeMobileLb()">Tutup Layar Obrolan/Papan Skor</button>
  </div>
</div>

<div id="app-container">
  <!-- Components will be injected here dynamically -->
</div>

<script>
  // Component Loader
  async function loadComponents() {
    const components = [
      'home', 'login', 'register', 'profile', 'host-setup', 
      'player-join', 'player-lobby', 'game', 'gameover'
    ];
    
    const container = document.getElementById('app-container');
    
    for (const c of components) {
      try {
        const res = await fetch(`/components/${c}.html`);
        const html = await res.text();
        container.insertAdjacentHTML('beforeend', html);
      } catch (e) {
        console.error('Failed to load component:', c, e);
      }
    }
    
    // Load main app script after all components are injected
    const script = document.createElement('script');
    script.src = '/js/app.js';
    document.body.appendChild(script);
  }
  
  loadComponents();
</script>
</body>
</html>
