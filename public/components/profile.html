<div id="screen-profile" class="screen">
  <div style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:2rem 1.5rem">
    <div class="card" style="width:100%; max-width:420px; text-align:center;">
      <div class="title-kanji" style="font-size:2rem; margin-bottom:1rem">プロフィール</div>
      
      <div style="padding:1.5rem 0; border-bottom:1px solid var(--border); margin-bottom:1.5rem">
        <p class="text-muted" style="font-size:.8rem; text-transform:uppercase; letter-spacing:.1em; margin-bottom:.5rem">Selamat datang,</p>
        <p style="font-size:1.3rem; font-weight:700; color:var(--white)" id="profile-username"></p>
        <p class="text-muted" style="font-size:.85rem; margin-top:.5rem" id="profile-email"></p>
      </div>

      <div style="display:flex; flex-direction:column; gap:.75rem; margin-bottom:1.5rem">
        <div class="card" style="background:var(--surface); padding:1rem">
          <p class="text-muted" style="font-size:.8rem">Total Permainan</p>
          <p style="font-size:1.5rem; font-weight:700; color:var(--gold)" id="profile-games">0</p>
        </div>
        <div class="card" style="background:var(--surface); padding:1rem">
          <p class="text-muted" style="font-size:.8rem">Total Skor</p>
          <p style="font-size:1.5rem; font-weight:700; color:var(--red)" id="profile-score">0</p>
        </div>
      </div>

      <div class="divider"></div>

      <button class="btn btn-red btn-full mt-2" onclick="goToHomeFromProfile()">
        ⚔️ Mulai Bermain
      </button>
      <button class="btn btn-ghost btn-full mt-1" onclick="handleLogout()">
        🚪 Logout
      </button>
    </div>
  </div>
</div>
