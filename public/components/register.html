<div id="screen-register" class="screen">
  <div style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:2rem 1.5rem">
    <div class="join-form anim-fade">
      <div class="text-center" style="margin-bottom:2rem">
        <div class="title-kanji" style="font-size:2.5rem">登録</div>
        <div class="title-sub" style="margin-top:.3rem">Daftar Akun Baru</div>
      </div>

      <div class="form-group">
        <label>Username</label>
        <input type="text" id="register-username" class="input"
               placeholder="Buat username…" maxlength="50"
               onkeydown="if(event.key==='Enter')handleRegister()" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="register-email" class="input"
               placeholder="Masukkan email…" maxlength="100"
               onkeydown="if(event.key==='Enter')handleRegister()" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="register-password" class="input"
               placeholder="Buat password (min. 6 karakter)…"
               onkeydown="if(event.key==='Enter')handleRegister()" />
      </div>

      <button class="btn btn-red btn-full btn-lg mt-2" id="btn-register" onclick="handleRegister()">
        ✏️ Daftar
      </button>
      <button class="btn btn-ghost btn-full mt-1" onclick="showScreen('screen-login')">
        🔓 Sudah Punya Akun
      </button>
      <button class="btn btn-ghost btn-full mt-1" onclick="showScreen('screen-home')">
        ← Kembali
      </button>

      <p class="text-muted text-center mt-2" style="font-size:.8rem">
        <span id="register-error" style="color:var(--wrong)"></span>
      </p>
    </div>
  </div>
</div>
