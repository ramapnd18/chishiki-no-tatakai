<div id="screen-gameover" class="screen">
  <div class="anim-fade text-center">
    <div class="title-kanji" style="font-size:3rem">終了</div>
    <div class="title-sub">Permainan Selesai</div>
  </div>

  <div class="podium anim-fade-2" id="podium"></div>

  <table class="final-table anim-fade-3" id="final-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Nama</th>
        <th>Skor</th>
        <th>✅</th>
        <th>❌</th>
      </tr>
    </thead>
    <tbody id="final-tbody"></tbody>
  </table>

  <div class="flex gap-1 mt-3 anim-fade-3" style="flex-wrap:wrap; justify-content:center">
    <button id="btn-play-again" class="btn btn-red btn-lg" style="display:none" onclick="playAgain()">
      🔄 Main Lagi
    </button>
    <button class="btn btn-ghost" onclick="leaveAndGoHome()">🏠 Menu Utama</button>
  </div>
</div>
