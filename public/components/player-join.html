<div id="screen-player-join" class="screen">
  <div style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:2rem 1.5rem">
    <div class="join-form anim-fade">
      <div class="text-center" style="margin-bottom:2rem">
        <div class="title-kanji" style="font-size:2.5rem">入室</div>
        <div class="title-sub" style="margin-top:.3rem">Masuk ke Room</div>
      </div>

      <div class="form-group">
        <label>Nama Kamu</label>
        <input type="text" id="player-name-input" class="input"
               placeholder="Masukkan namamu…" maxlength="24"
               onkeydown="if(event.key==='Enter')joinRoom()" />
      </div>

      <div class="form-group">
        <label>Kode Room</label>
        <input type="text" id="player-room-code-input" class="input"
               placeholder="contoh: AB1CD2" maxlength="6"
               style="text-transform:uppercase; font-family:'JetBrains Mono',monospace; letter-spacing:.15em; font-size:1.1rem"
               oninput="this.value=this.value.toUpperCase()"
               onkeydown="if(event.key==='Enter')joinRoom()" />
      </div>

      <button class="btn btn-red btn-full btn-lg mt-2" id="btn-join" onclick="joinRoom()">
        ⚔️ Bergabung
      </button>
      <button class="btn btn-ghost btn-full mt-1" onclick="showScreen('screen-home')">
        ← Kembali
      </button>
    </div>
  </div>
</div>
